<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="manifest" href="/manifest.json" />
		<meta name="theme-color" content="#bc3d00" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Lalo Bakery" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<script>
			// Scroll reveals start hidden only when JS runs (layout.css). If the app never
			// hydrates, show everything rather than leave the page blank.
			document.documentElement.classList.add('js-motion');
			setTimeout(function () {
				if (!document.documentElement.classList.contains('motion-ready'))
					document.documentElement.classList.remove('js-motion');
			}, 4000);
			// The browser can offer the install prompt before the app hydrates; keep it.
			window.addEventListener('beforeinstallprompt', function (e) {
				e.preventDefault();
				window.__installPrompt = e;
			});
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
